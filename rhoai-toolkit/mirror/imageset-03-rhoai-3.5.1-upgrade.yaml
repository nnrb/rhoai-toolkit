# [03] RHOAI 3.5.1 업그레이드용 (05 작업계획서 3단계에서 적용: MIRROR_PROFILE=rhoai351, 접미사 -rhoai351. 검토: 04_검토자료)
#
# 인터넷 구간:  oc mirror -c imageset-03-rhoai-3.5.1-upgrade.yaml file:///data/mirror/rhoai351 --v2
# 폐쇄망 구간:  oc mirror -c imageset-03-rhoai-3.5.1-upgrade.yaml --from file:///data/mirror/rhoai351 \
#                 docker://pocprg01.ocp.bcnuri.com:5000/rhoai351 --v2
#   - 결과 CatalogSource(cs-redhat-operator-index-v4-20 등)를 새로 만든 뒤 rhods-operator Subscription의 source·channel(stable-3.5)을 바꾼다.
#   - catalog 태그는 클러스터 OCP minor(4.20)와 맞춘다(기존 ai-342·ai-other 카탈로그는 v4.22 index).
#
# 출처: red-hat-data-services/rhoai-disconnected-install-helper rhoai-3.5.1-imagesetconfig.yaml(2026-10-22 조회), RHOAI 3.5 설치·MaaS·llm-d 문서
# 3.5는 EUS 릴리스(stable-3.5, eus-3.5 채널).
kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1
mirror:
  operators:
    - catalog: registry.redhat.io/redhat/redhat-operator-index:v4.20
      packages:
        - name: rhods-operator
          channels:
            - name: stable-3.5
              minVersion: 3.5.1
              maxVersion: 3.5.1
