# [02] RHOAI 3.4.2 기능 활성화 추가 이미지 (03 RHOAI 3.4.2 작업계획서 4단계에서 적용, 04에서 사용)
#
# 인터넷 구간:  oc mirror -c imageset-02-rhoai-3.4.2-features.yaml file:///data/mirror/rhoai342-features-202611 --v2
# 폐쇄망 구간:  oc mirror -c imageset-02-rhoai-3.4.2-features.yaml --from file:///data/mirror/rhoai342-features-202611 \
#                 docker://pocprg01.ocp.bcnuri.com:5000/rhoai342-202611 --v2
#   - 기존 경로(rhoai34-20260813, otheroperator 등)와 섞지 않도록 새 경로(rhoai342-202611)에 반입한다.
#   - 결과: working-dir/cluster-resources/(idms-oc-mirror.yaml, itms-oc-mirror.yaml) → 03 작업계획서 4단계. config/env.sh의 FEATURE_MIRROR_DIR = 위 file:// 경로
#   - 결과 객체 이름(idms-generic-0·itms-generic-0)이 클러스터의 기존 객체와 같다. 원본을 직접 적용하면 기존 매핑을 덮어써 지운다.
#     workday/10-mirror-apply.sh가 이름에 -202611을 붙인 사본을 적용한다.
#   - 스크립트 실행용 이미지([S])도 이 파일 하나로 반입한다. 파일을 나누면 oc-mirror 결과 객체 이름이 또 같아져 사본끼리 덮어쓴다.
#
# 구역
#   [S] 스크립트 실행용: 03_bc-rhoai-toolkit 스크립트·작업계획서 명령이 직접 띄우는 Pod 이미지(mirror/runtime-images.txt와 같은 목록)
#   [B] Ray·학습 런타임: Operator가 아닌 helper 목록으로만 제공되는 이미지
#   [C] 05-image-gap-check.sh로 찾은 누락 이미지(19:00 전 추가)
#
# 이미 반입되어 이번에 다시 넣지 않는 것(2026-10-28 점검·2026-09 반입 이력)
#   - RHOAI 3.4.2 Operator와 relatedImages(대시보드·KServe·vLLM·llm-d scheduler·maas-api·TrustyAI·MLflow·EvalHub 등): cs-redhat-operator-index-ai-342(rhoai34-20260813)
#   - 의존 Operator 19종(RHCL 1.4.2·Authorino·Limitador·DNS·LWS·SM3·cert-manager·Kueue 1.3/1.4·JobSet·COO·OTel·Tempo·NFD 등): cs-redhat-operator-index-ai-other(otheroperator)
#   - NVIDIA GPU Operator 26.3.3: cs-certified-operator-index-nvidia-263
#   → 실제로 내부 레지스트리에 있는지는 workday/05-image-gap-check.sh로 확인한다. MISSING이 나오면 아래 [C]에 추가한다.
#
# 제외한 것
#   - Workbench(노트북·code-server) 이미지 전체: 2026-10-29 요청으로 반입 대상에서 뺐다. 기존 반입분 Workbench는 그대로 쓴다.
#   - AMD ROCm 이미지: BC GPU는 NVIDIA만 있다(H200·A40·L40S).
#   - 인터넷이 있어야 동작하는 RHOAI-Toolkit 데모 이미지(SearXNG 웹검색 MCP, Open WebUI, n8n, Grafana, MinIO, modelcar 데모 모델 등)
kind: ImageSetConfiguration
apiVersion: mirror.openshift.io/v2alpha1
mirror:
  additionalImages:
    # ==== [S] 스크립트 실행용 ==================================================================
    # [S1] OTel Python 자동 주입(04 작업계획서 18단계, config/env.sh OTEL_PYTHON_IMAGE). 태그 이미지라 ITMS가 생성된다.
    #      반입 후 내부 경로(pocprg01.ocp.bcnuri.com:5000/rhoai342-202611/open-telemetry/opentelemetry-operator/autoinstrumentation-python:0.54b1)를
    #      config/env.sh OTEL_PYTHON_IMAGE에 넣는다(기본값이 이 경로). 이미 <레지스트리>/opentelemetry/autoinstrumentation-python:0.54b1로 반입했다면 이 줄은 지워도 된다.
    - name: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python:0.54b1
    # [S2] Limitador Redis(scripts/63-maas-fixes.sh, MAAS_REDIS). 토큰 한도 카운터. 반입 후 digest로 고정 권장(config REDIS_IMAGE)
    - name: registry.redhat.io/rhel9/redis-7:latest
    # [S3] Kubernetes MCP 서버, 읽기 전용(scripts/71-mcp-servers.sh, FEATURE_MCP_SERVERS). Gen AI Playground MCP 도구
    - name: quay.io/redhat-ai-services/kubernetes-mcp-server:latest
    # [S4] PostgreSQL 16(scripts/61-maas-db.sh MaaS DB): 2026-08 반입분(rhoai34-20260813/rhel9/postgresql-16) 사용 → 다시 넣지 않는다.
    #      gap-check에서 MISSING이면 주석을 푼다.
    # - name: registry.redhat.io/rhel9/postgresql-16@sha256:cb16884277c60ba0e2adfd7d0342eb87e651c0ecdbe8c8471615059b5c722846
    # [S5] oc debug node(01 작업계획서)의 tools 이미지는 imageset-01(release payload)에 포함된다.

    # ==== [B] Ray·학습 런타임 ==================================================================
